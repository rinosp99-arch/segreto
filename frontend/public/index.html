<!doctype html>
<html lang="it" translate="no">
    <head>
        <meta charset="utf-8" />
        <meta name="google" content="notranslate" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#0e0e11" />
        <meta name="description" content="LATO SEGRETO — il lato che non hai ancora visto. Creator premium con un lato pubblico elegante e un lato segreto tutto da svelare." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
        <title>LATO SEGRETO — Il lato che non hai ancora visto</title>
        <style>
            html, body { background: #0e0e11; }
            .seo-snapshot { max-width: 1100px; margin: 0 auto; padding: 96px 20px 48px; color: #e9e3d8; font-family: Manrope, system-ui, sans-serif; line-height: 1.6; }
            .seo-snapshot h1, .seo-snapshot h2 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; letter-spacing: .02em; }
            .seo-snapshot h1 { font-size: 2.6rem; margin: 0 0 .5rem; }
            .seo-snapshot a { color: #d7b56d; text-decoration: none; }
            .seo-snapshot ul { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
            .seo-snapshot li { font-size: .9rem; }
            .seo-snapshot img { display: block; width: 100%; height: auto; max-height: 420px; object-fit: cover; border-radius: 14px; margin-bottom: 8px; }
            .seo-snapshot article img { max-width: 420px; }
        </style>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
